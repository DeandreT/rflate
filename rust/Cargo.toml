[package]
name = "rflate-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WebAssembly DEFLATE core for the rflate npm package"
repository = "https://github.com/DeandreT/rflate"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
zlib-rs = { version = "=0.6.8", default-features = false, features = ["rust-allocator"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
